<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <title>ねあのぺーじ</title>
    <!-- OGP -->
    <meta property="og:title" content="ねあねあぺーじ">
    <meta property="og:description" content="SNSリンク＆まとめページ">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://example.com">
    <meta property="og:image" content="https://example.com/ogp.png">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="ねあねあぺーじ">
    <meta name="twitter:description" content="SNSリンク＆まとめページ">
    <meta name="twitter:image" content="https://example.com/ogp.png">
    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(270deg, #667eea, #764ba2, #6a11cb);
            background-size: 600% 600%;
            animation: gradientMove 10s ease infinite;
            color: white;
            transition: 0.3s;
        }

        .dark-mode {
            background: linear-gradient(270deg, #0f2027, #203a43, #2c5364);
            color: white;
        }

        .container {
            text-align: center;
            width: 90%;
            max-width: 400px;
            animation: fadeIn 1s ease forwards;
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 20px;
        }

        .icon {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 0 auto 20px;
            background-image: url("./ぴとさくももんが.jpg");
            background-size: cover;
            background-position: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            border: 3px solid white;
            animation: float 3s ease-in-out infinite;
            transition: 0.3s;
        }
        .icon:hover {
            transform: scale(1.1);
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            opacity: 0.8;
            margin-bottom: 20px;
        }

        .link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: white;
            text-decoration: none;
            padding: 15px;
            margin: 10px 0;
            border-radius: 30px;
            font-weight: bold;
            transition: 0.3s;
        }

        .youtube {
            background: linear-gradient(45deg, #ff0000, #ff5e5e);
        }

        .twitter {
            background: linear-gradient(45deg, #1da1f2, #60c5ff);
        }

        .twitch {
            background: linear-gradient(45deg, #9146ff, #b983ff);
        }

        .link:hover {
            transform: scale(1.07);
            box-shadow: 0 0 20px rgba(255,255,255,0.8);
        }
        .link:active {
            transform: scale(0.95);
        }

        .toggle-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }
        .link img {
            width: 22px;
            height: 22px;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .dark-mode .container {
            background: rgba(0, 0, 0, 0.4);
        }

        .dark-mode .link {
            filter: brightness(0.8);
        }

        .dark-mode .link:hover {
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        /* ===== スマホ最適化 ===== */
        @media (max-width: 600px) {
            body {
                align-items: flex-start;
                padding: 30px 10px;
            }

            .container {
                width: 95%;
                padding: 15px;
                border-radius: 15px;
            }

            h1 {
                font-size: 20px;
            }

            p {
                font-size: 14px;
            }

            .link {
                padding: 12px;
                font-size: 14px;
                border-radius: 20px;
            }

            .link img {
                width: 18px;
                height: 18px;
            }

            .toggle-btn {
                top: 10px;
                right: 10px;
                padding: 8px;
                font-size: 14px;
            }

            .icon {
                width: 80px;
                height: 80px;
            }
        }
    </style>
</head>
<body>

<button id="modeBtn" class="toggle-btn" onclick="toggleMode()">🌙</button>

<div class="container">
    <div class="icon"></div>

    <h1>ねあねあ</h1>
    <p>ばろとなんか</p>

    <a href="https://www.youtube.com/@neaiq" class="link youtube" target="_blank"><img src="./YouTubeアイコン.webp"> YouTube</a>
    <a href="https://twitter.com/neaiq_1" class="link twitter" target="_blank"><img src="./Twitter.webp"> Twitter</a>
    <a href="https://www.twitch.tv/neaiq_1" class="link twitch" target="_blank"><img src="./twitch_logo_icon_189242.webp"> Twitch</a>
</div>

<script>
function toggleMode() {
    document.body.classList.toggle("dark-mode");

    if (document.body.classList.contains("dark-mode")) {
        localStorage.setItem("mode", "dark");
    } else {
        localStorage.setItem("mode", "light");
    }
    const btn = document.getElementById("modeBtn");
    if (document.body.classList.contains("dark-mode")) {
        btn.textContent = "☀️";
    } else {
        btn.textContent = "🌙";
    }
}

window.onload = function () {
    const savedMode = localStorage.getItem("mode");

    if (savedMode === "dark") {
        document.body.classList.add("dark-mode");
        document.getElementById("modeBtn").textContent = "☀️";
    } else {
        document.getElementById("modeBtn").textContent = "🌙";
    }
};
</script>

</body>
</html>
